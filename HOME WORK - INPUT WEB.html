<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SURA WEB -> SIGN IN</title>
	<link rel="stylesheet" type="text/css" href="External CSS.css">
</head>
<body>
	<center>
	<h2>Sign into the website of Sura</h2>
	<form action="WEB of SURA.html">
		<label>First Name:</label>
		<input type="text" name="" placeholder="Mr/Mrs" class="in"><br><br>

		<label>Last Name:</label>
		<input type="text" name="" placeholder="Surname" class="in"><br><br>

		<label>Enter your birth date:</label>
		<input type="date" name="" class="in"><br><br>

		<label>Contact number:</label>
		<input type="number" name="" placeholder="01XXXXXXXXX" class="in"><br><br> 

		<label>Occupation:</label><br>
		<input type="radio" name="i">
		<label>Agriculture and Natural Resource-Based Professions</label><br>

		<input type="radio" name="i">
		<label>Knowledge and Technology-Based Professions</label><br>

		<input type="radio" name="i">
		<label>Industry and Manufacturing Professions</label><br>

		<input type="radio" name="i">
		<label>Trade and Business Professions</label><br>

		<input type="radio" name="i">
		<label>Service Sector Professions</label><br>

		<input type="radio" name="i">
		<label>Study or learning</label>

		<br><br> <label>Select your gender:</label>
		<input type="radio" name="sum">
		<label>Male</label>

		<input type="radio" name="sum">
		<label>Female</label>

		<input type="radio" name="sum">
		<label>Children</label><br><br>

		<label>E-mail Account:</label>
		<input type="email" name="" placeholder="anything@browser.com" class="in" style="width:250px;"><br><br>

		<label>Pass code:</label>
		<input type="password" name="" placeholder="XXXX" class="in"><br><br>

		<label>User Name:</label>
		<input type="password" name="" class="in" placeholder="XXXXX">

		<p>Your G-mail account's password is set for the user name.</p><br><br>

		<label>Choose your continent:</label>
		<select>
			<option>Asia</option>
			<option>Europe</option>
			<option>Africa</option>
			<option>North America</option>
			<option>South America</option>
			<option>Antarctica</option>
			<option>Australlia</option>
		</select><br><br>

		<button>Sign In</button>
	</form>
	</center>
</body>
</html>
